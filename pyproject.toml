[project]
name = "rizm-challenge-henkel"
version = "0.1.0"
description = "Henkel Düsseldorf Holthausen Agentic Energy OS Challenge - Operational & Investment Optimization Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "oemof.solph>=0.5.3",
    "pvlib>=0.11.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "openpyxl>=3.1.0",
    "requests>=2.31.0",
    "highspy>=1.7.0",
    "jupyter>=1.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

