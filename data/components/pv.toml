# Rooftop PV System Configuration
# Source: Danish Energy Agency Technology Data for Electricity Generation (2024), Table 22
# Adjusted for German market conditions and large-scale rooftop installations

[pv]
model_name = "Generic_Rooftop_Crystalline_Si"

# Economics
capex_eur_per_kw = 800.0       # EUR/kWp installed, large-scale rooftop (>500 kWp)
opex_eur_per_kw_year = 12.0    # Fixed O&M per year (1.5% of CAPEX)
lifetime_years = 25

# Performance
degradation_rate_per_year = 0.005  # 0.5%/yr linear degradation
tilt_deg = 30.0                     # Optimal tilt for Duesseldorf latitude (~51 deg N)
azimuth_deg = 180.0                 # South-facing
albedo = 0.2                        # Urban rooftop ground reflectance

# Spatial constraint (from Google Earth analysis of Henkel Holthausen rooftops)
max_capacity_kw = 25000.0     # 25 MWp estimated maximum rooftop area
